[package]
name = "corelocation"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Location framework for TontooOS - GPS, WiFi, IP, Timezone based positioning"
authors = ["arlomu"]

[lib]
crate-type = ["cdylib", "rlib"]
name = "corelocation"
path = "src/lib.rs"

[[example]]
name = "test_location"
path = "examples/test_location.rs"

[[example]]
name = "test_wifi"
path = "examples/test_wifi.rs"

[[example]]
name = "test_async"
path = "examples/test_async.rs"

[dependencies]
networkkit = { path = "../NetworkKit" }
foundation = { path = "../Foundation" }
