[package]
name = "corelocation"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Location framework for TontooOS - GPS, WiFi, IP, Timezone based positioning"
authors = ["arlomu"]

[lib]
name = "corelocation"
path = "src/lib.rs"

[[example]]
name = "test_location"
path = "examples/test_location.rs"

[[example]]
name = "test_wifi"
path = "examples/test_wifi.rs"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
